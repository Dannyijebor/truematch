<style>
.tm-call-screen{position:fixed;inset:0;z-index:9998;display:none;flex-direction:column;align-items:stretch;justify-content:space-between;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.tm-call-screen.tm-show{display:flex}
.tm-call-screen.tm-hide{display:none!important}
.tm-call-bg{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 30% 20%,rgba(0,168,132,0.35),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(83,189,235,0.28),transparent 60%),linear-gradient(180deg,#0a1418 0%,#030a0d 100%)}
.tm-call-bg::after{content:"";position:absolute;inset:0;backdrop-filter:blur(40px) saturate(150%);-webkit-backdrop-filter:blur(40px) saturate(150%);background:rgba(0,0,0,0.35)}
.tm-call-top{position:relative;z-index:2;text-align:center;padding:max(env(safe-area-inset-top,0px),22px) 20px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.tm-call-type{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.6)}
.tm-call-name{font-size:26px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,0.6)}
.tm-call-status{font-size:14px;color:rgba(255,255,255,0.72);font-variant-numeric:tabular-nums}
.tm-call-status.ringing{animation:tmpulse 1.6s ease-in-out infinite}
@keyframes tmpulse{0%,100%{opacity:0.6}50%{opacity:1}}
.tm-call-center{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.tm-call-avatar-wrap{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center}
.tm-call-avatar{width:160px;height:160px;border-radius:50%;background:linear-gradient(135deg,#00a884,#0b6b56);color:#fff;font-size:60px;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 20px 60px rgba(0,168,132,0.35),0 0 0 6px rgba(255,255,255,0.06);z-index:2;position:relative}
.tm-call-avatar img{width:100%;height:100%;object-fit:cover}
.tm-call-avatar.ringing{animation:tmring 1.8s ease-in-out infinite}
@keyframes tmring{0%,100%{box-shadow:0 20px 60px rgba(0,168,132,0.35),0 0 0 6px rgba(255,255,255,0.06)}50%{box-shadow:0 20px 60px rgba(0,168,132,0.55),0 0 0 22px rgba(0,168,132,0.08)}}
.tm-call-meter{position:absolute;inset:0;z-index:1;pointer-events:none}
.tm-call-meter span{position:absolute;left:50%;top:50%;width:3px;height:8px;background:#4dd8b3;border-radius:2px;transform-origin:50% 0;opacity:0.85;transition:height 0.06s linear,opacity 0.06s linear}
.tm-call-meter.listening span{background:rgba(255,255,255,0.28)}
.tm-call-meter.speaking span{background:#4dd8b3;opacity:1}
.tm-self-pip{position:absolute;top:20px;right:20px;width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#1f2c33,#0b1418);border:2px solid rgba(255,255,255,0.14);box-shadow:0 8px 24px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:700;overflow:hidden;z-index:3}
.tm-self-pip img{width:100%;height:100%;object-fit:cover}
.tm-call-reactions{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.tm-call-reactions span{position:absolute;bottom:120px;font-size:44px;opacity:0;animation:tmreact 2.6s ease-out forwards;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4))}
@keyframes tmreact{0%{opacity:0;transform:translateY(0) scale(0.5)}15%{opacity:1;transform:translateY(-30px) scale(1.15)}60%{opacity:1;transform:translateY(-160px) scale(1)}100%{opacity:0;transform:translateY(-320px) scale(0.9)}}
.tm-call-controls{position:relative;z-index:3;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:18px}
.tm-call-emoji-row{display:none;gap:8px;padding:10px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:999px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tm-call-emoji-row.tm-show{display:flex;animation:tmemoj 0.24s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes tmemoj{from{opacity:0;transform:translateY(8px) scale(0.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.tm-call-emoji-row button{width:44px;height:44px;border:none;background:transparent;font-size:26px;cursor:pointer;border-radius:50%;padding:0;transition:transform 0.14s cubic-bezier(0.34,1.56,0.64,1)}
.tm-call-emoji-row button:active{transform:scale(0.82)}
.tm-call-buttons{display:flex;align-items:center;justify-content:center;gap:12px}
.tm-call-btn{width:60px;height:60px;border-radius:50%;border:none;background:rgba(255,255,255,0.12);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 8px 24px rgba(0,0,0,0.3);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform 0.14s cubic-bezier(0.34,1.56,0.64,1),background 0.18s ease;position:relative}
.tm-call-btn:active{transform:scale(0.9)}
.tm-call-btn svg{width:24px;height:24px}
.tm-call-btn.tm-active{background:#fff;color:#0a1418}
.tm-call-btn.tm-end{background:#ef4444;box-shadow:0 8px 28px rgba(239,68,68,0.55)}
.tm-call-btn.tm-end svg{transform:rotate(135deg)}
.tm-call-btn.tm-accept{background:#22c55e;box-shadow:0 8px 28px rgba(34,197,94,0.55)}
.tm-call-btn.tm-accept svg{animation:tmpulse2 1s ease-in-out infinite}
@keyframes tmpulse2{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}
.tm-call-btn-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:0.6px;text-transform:uppercase;color:rgba(255,255,255,0.55);font-weight:600;white-space:nowrap}
.tm-call-btn.tm-active .tm-call-btn-label{color:#fff}
.tm-call-muted-badge{position:absolute;bottom:12px;right:12px;width:30px;height:30px;border-radius:50%;background:#ef4444;display:none;align-items:center;justify-content:center;z-index:3;box-shadow:0 4px 12px rgba(239,68,68,0.5)}
.tm-call-muted-badge svg{width:14px;height:14px;color:#fff}
.tm-call-avatar-wrap.tm-muted .tm-call-muted-badge{display:flex}
body.tm-in-call{overflow:hidden}
body.tm-in-call nav,body.tm-in-call header.app-header,body.tm-in-call footer{visibility:hidden}

.tm-remote-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:none;background:#000}
.tm-remote-video.tm-on{display:block}
.tm-local-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;display:none}
.tm-local-video.tm-on{display:block}
.tm-self-pip-init{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.tm-self-pip.tm-has-video .tm-self-pip-init{display:none}
.tm-call-screen.tm-video-mode .tm-call-avatar-wrap,
.tm-call-screen.tm-video-mode .tm-call-meter{display:none}
.tm-call-screen.tm-video-mode .tm-call-center{padding:0}
.tm-call-btn.tm-flip{display:none}
.tm-call-screen.tm-video-mode .tm-flip{display:flex}
.tm-call-pill{position:fixed;bottom:20px;right:16px;left:16px;display:none;align-items:center;gap:12px;padding:12px 14px;background:rgba(22,28,32,0.98);border:1px solid rgba(255,255,255,0.08);border-radius:22px;box-shadow:0 20px 48px rgba(0,0,0,0.5);z-index:9997;color:#fff}.tm-call-pill.tm-show{display:flex}.tm-call-pill-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#00a884,#0b6b56);color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}.tm-call-pill-avatar img{width:100%;height:100%;object-fit:cover}.tm-call-pill-info{flex:1;min-width:0}.tm-call-pill-name{font-size:14px;font-weight:700}.tm-call-pill-status{font-size:12px;color:rgba(255,255,255,0.6)}.tm-call-pill-btn,.tm-call-pill-end{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,0.12);color:#fff;flex-shrink:0}.tm-call-pill-end{background:#ef4444}.tm-call-pill-btn.tm-active{background:#fff;color:#0a1418}.tm-call-screen.tm-video-mode .tm-call-avatar-wrap{display:none}.tm-call-screen.tm-video-mode .tm-remote-video{display:block}</style>
