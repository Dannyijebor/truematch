{#
  TrueMatch animated wordmark — light sweep across the text
#}
{% set s = size|default('md') %}
{% set text_size = {'sm':'text-lg','md':'text-[22px]','lg':'text-2xl','xl':'text-3xl'} %}

<a href="{% if user %}/feed{% else %}/{% endif %}"
   class="tm-logo inline-flex items-baseline gap-1 {{ text_size[s] }} font-bold tracking-tight leading-none select-none">
  <span class="tm-logo-word">
    <span class="tm-logo-true">True</span><span class="tm-logo-match">Match</span>
  </span>
  <span class="tm-logo-dot"></span>
</a>
