name: Ingest jobs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: 'pip install "psycopg[binary]" sqlalchemy python-dateutil httpx beautifulsoup4 python-dotenv pydantic==1.10.26 pydantic-settings==1.99 jinja2'
      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.ingestion.run_all
